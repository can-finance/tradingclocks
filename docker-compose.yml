services:
  # Production-build preview: `docker compose up preview` builds the site and
  # serves dist/ at http://localhost:4173 — for testing the built site (with
  # prerendered pages) locally. Not started by a plain `docker compose up`.
  preview:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tradingclocks-preview
    profiles: ["preview"]
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "4173:4173"
    command: sh -c "npm run build && npx vite preview --host 0.0.0.0 --port 4173"

  tradingclocks:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tradingclocks-dev
    volumes:
      - .:/workspace                 # bind mount so file *contents* stay in sync
      - /workspace/node_modules      # isolate container's node_modules from host
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      # Docker Desktop's Windows/WSL2 bind mount doesn't reliably forward
      # inotify events for host-side edits, so Vite's default file watcher
      # never sees changes. Polling (see vite.config.ts) is the standard
      # workaround; without it you must `docker compose restart` after edits.
      - CHOKIDAR_USEPOLLING=true
